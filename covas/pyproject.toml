[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "covas"
version = "0.1.0"
description = "Manage multiple Claude Code profiles and environments with ease."
readme = "README.md"
authors = [{ name = "Covas Authors" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.0"
]

[project.scripts]
covas = "covas.cli:cli"

[tool.setuptools]
packages = ["covas"]